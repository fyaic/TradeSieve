name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  quality-and-tests:
    name: Format, lint, type, unit, architecture, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.8"
          python-version: "3.13.14"
          enable-cache: true
      - name: Verify lock and install dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy
      - name: Check generated contracts
        run: uv run --locked python scripts/generate_contract.py --check
      - name: Run unit and architecture tests
        run: uv run --locked pytest
      - name: Build package
        run: uv build

  security:
    name: Secret and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.8"
          python-version: "3.13.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 uv run --locked detect-secrets-hook --baseline .secrets.baseline
      - name: Audit Python dependencies
        run: |
          set -o pipefail
          uv export --locked --all-groups --no-emit-project --format requirements-txt \
            | uv run --locked pip-audit --requirement /dev/stdin --strict --progress-spinner off

  docker-reference:
    name: Docker Compose reference deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify reference stack
        run: ./scripts/test_compose.sh

  source-snapshot-postgresql:
    name: Source snapshot PostgreSQL 18.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source snapshot persistence
        run: ./scripts/test_source_snapshot_postgres.sh

  screening-submission-postgresql:
    name: Screening submission PostgreSQL 18.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify screening submission persistence
        run: ./scripts/test_screening_submission_postgres.sh

  official-source-postgresql:
    name: Official source projections PostgreSQL 18.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify official source projections
        run: ./scripts/test_official_source_postgres.sh
