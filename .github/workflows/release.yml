name: Tagged alpha release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Verify, build, and publish release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          python-version: "3.13.14"
          enable-cache: true

      - name: Verify locked project
        run: |
          uv lock --check
          uv sync --locked --all-groups
          ./scripts/check.sh

      - name: Build wheel and source archive
        run: |
          uv build
          uv run python -c "from importlib.metadata import version; from os import environ; from packaging.version import Version; assert Version(environ['GITHUB_REF_NAME'].removeprefix('v')) == Version(version('tradesieve'))"
          (
            cd dist
            shasum -a 256 tradesieve-*.whl tradesieve-*.tar.gz > ../SHA256SUMS
            shasum -a 256 -c ../SHA256SUMS
          )

      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "TradeSieve $release_version"
