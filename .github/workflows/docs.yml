name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate documentation and contracts
        run: ./scripts/check_docs.sh
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2.44.2 lint api/openapi/tradesieve.v1.json
